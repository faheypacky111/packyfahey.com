<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Packy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: oklch(22% 0.05 155);
      --text: oklch(94% 0.015 88);
      --muted: oklch(55% 0.04 155);
      --accent: oklch(74% 0.13 88);
      --font-display: 'Instrument Serif', Georgia, serif;
      --font-body: 'DM Sans', Helvetica, sans-serif;
      --edge: clamp(2rem, 3.6vw, 5rem);
    }

    /* hex fallbacks for browsers without oklch */
    @supports not (color: oklch(0% 0 0)) {
      :root {
        --bg: #0d2619;
        --text: #f2efe6;
        --muted: #6f8a7c;
        --accent: #c9a24b;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 4rem var(--edge);
    }

    h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(42px, 6.5vw, 88px);
      line-height: 1.2;
      letter-spacing: -0.02em;
      text-wrap: pretty;
      color: var(--text);
      max-width: 820px;
    }

    nav {
      margin-top: 2.75rem;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.95rem;
      letter-spacing: 0.01em;
    }

    nav a {
      color: var(--muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: color 0.2s ease;
    }

    nav a:hover,
    nav a:focus-visible { color: var(--text); }

    nav a:focus-visible {
      outline: 1px solid var(--muted);
      outline-offset: 4px;
      border-radius: 2px;
    }

    .divider {
      width: 1px;
      height: 1rem;
      background: var(--muted);
      opacity: 0.4;
    }

    .x-logo { width: 0.85em; height: 0.85em; fill: currentColor; }

    footer {
      text-align: center;
      padding: 1.75rem var(--edge);
      font-family: var(--font-body);
      font-weight: 300;
      font-size: 0.8rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    @media (max-width: 600px) {
      nav { gap: 1.1rem; }
      nav .divider { display: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Building brands that have meaningful impact.</h1>

    <nav aria-label="Links">
      <a href="https://homevly.com" target="_blank" rel="noopener">Homevly</a>
      <a href="https://namevaultx.com" target="_blank" rel="noopener">NameVaultX</a>
      <span class="divider" aria-hidden="true"></span>
      <a href="https://x.com/faheypacky" target="_blank" rel="noopener">
        <svg class="x-logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24h-6.658l-5.214-6.817-5.966 6.817H1.16l7.73-8.835L1.254 2.25h6.826l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        @faheypacky
      </a>
    </nav>
  </main>

  <footer>&copy; 2026 Packy Fahey</footer>
</body>
</html>
